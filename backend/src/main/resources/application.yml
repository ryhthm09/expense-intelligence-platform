spring:
  application:
    name: expense-intelligence-api

  datasource:
    url: jdbc:postgresql://localhost:5432/expense_intelligence
    username: expense_user
    password: expense_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: change-me-in-production-use-at-least-256-bit-secret-key-here
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.expenseintelligence: DEBUG
    org.springframework.security: INFO
